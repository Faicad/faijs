name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [24]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npx vitest run

      # 根 vitest projects 有意排除 draw / faijs-fasteners / faijs-gears（均较重或有
      # 独立配置）；这里按包单独跑。faijs-gears 只跑轻量核心子集（API 面 + 齿廓数学 +
      # 新增类纯数学 + 裸齿轮体积；全套 BREP parity >900s 不适合 CI，见 ci.ps1 注释）。
      - name: Run faijs-draw tests
        working-directory: packages/draw
        run: npx vitest run

      - name: Run faijs-fasteners tests
        working-directory: packages/faijs-fasteners
        run: npx vitest run

      - name: Run faijs-gears core subset tests
        working-directory: packages/faijs-gears
        run: npx vitest run src/index.test.ts src/profile.test.ts src/new-gear-math.test.ts src/spur-gear-build.test.ts

      - name: Install demo dependencies
        working-directory: packages/demo
        run: npm ci

      - name: Install Playwright browsers
        working-directory: packages/demo
        run: npx playwright install --with-deps chromium

      - name: Run demo e2e tests
        working-directory: packages/demo
        run: npm run test:e2e

      - name: Run demo preview e2e tests (CDN importmap)
        working-directory: packages/demo
        run: npm run test:e2e:preview
