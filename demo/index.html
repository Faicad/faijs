<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>faijs — CAD Scripting Demo</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <h1>faijs <span class="subtitle">CAD Scripting Demo</span></h1>
      <div class="header-controls">
        <select id="example-select" class="select">
          <option value="box-boolean">Box + Sphere Subtract</option>
          <option value="drill-test">Box + Cylinder Drill</option>
          <option value="text-engrave">Text Engrave</option>
          <option value="transform-chain">Transform Chain</option>
        </select>
        <select id="mode-select" class="select" title="Execution mode">
          <option value="auto">auto</option>
          <option value="brep">brep</option>
          <option value="mesh">mesh</option>
        </select>
        <button id="run-btn" class="btn btn-primary">Run ▶</button>
      </div>
    </header>

    <!-- Main content: two-column layout -->
    <main class="main">
      <!-- Left: code editor -->
      <section class="editor-panel">
        <div class="panel-header">faijs source code</div>
        <textarea id="code-editor" class="code-editor" spellcheck="false"></textarea>
      </section>

      <!-- Right: 3D viewer -->
      <section class="viewer-panel">
        <div class="panel-header">3D model</div>
        <div id="viewer-container" class="viewer-container">
          <canvas id="three-canvas"></canvas>
          <div id="status-bar" class="status-bar"></div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
