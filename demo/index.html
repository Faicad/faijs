<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>faijs — CAD Scripting Demo</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
        "three/": "https://cdn.jsdelivr.net/npm/three@0.184.0/",
        "manifold-3d": "https://cdn.jsdelivr.net/npm/manifold-3d@3.5.1/manifold.js",
        "manifold-3d/manifold": "https://cdn.jsdelivr.net/npm/manifold-3d@3.5.1/manifold.js",
        "manifold-3d/manifold.js": "https://cdn.jsdelivr.net/npm/manifold-3d@3.5.1/manifold.js",
        "manifold-3d/manifoldCAD": "https://cdn.jsdelivr.net/npm/manifold-3d@3.5.1/lib/manifoldCAD.js",
        "manifold-3d/manifoldCAD.js": "https://cdn.jsdelivr.net/npm/manifold-3d@3.5.1/lib/manifoldCAD.js",
        "manifold-3d/": "https://cdn.jsdelivr.net/npm/manifold-3d@3.5.1/",
        "occt-wasm": "https://cdn.jsdelivr.net/npm/occt-wasm@3.7.0/dist/index.js",
        "occt-wasm/": "https://cdn.jsdelivr.net/npm/occt-wasm@3.7.0/",
        "@gltf-transform/core": "https://cdn.jsdelivr.net/npm/@gltf-transform/core@4.4.2/dist/index.js",
        "@gltf-transform/functions": "https://cdn.jsdelivr.net/npm/@gltf-transform/functions@4.4.2/dist/index.js",
        "@gltf-transform/extensions": "https://cdn.jsdelivr.net/npm/@gltf-transform/extensions@4.4.2/dist/index.js",
        "ktx-parse": "https://cdn.jsdelivr.net/npm/ktx-parse@1.1.0/dist/ktx-parse.esm.js",
        "ndarray": "https://cdn.jsdelivr.net/npm/ndarray@1.0.19/+esm",
        "ndarray-ops": "https://cdn.jsdelivr.net/npm/ndarray-ops@1.2.2/+esm",
        "ndarray-lanczos": "https://cdn.jsdelivr.net/npm/ndarray-lanczos@0.3.0/dist/ndarray-lanczos.modern.js",
        "ndarray-pixels": "https://cdn.jsdelivr.net/npm/ndarray-pixels@5.2.0/dist/ndarray-pixels-browser.js",
        "property-graph": "https://cdn.jsdelivr.net/npm/property-graph@4.1.0/dist/index.mjs",
        "@jridgewell/trace-mapping": "https://cdn.jsdelivr.net/npm/@jridgewell/trace-mapping@0.3.31/dist/trace-mapping.mjs",
        "@jridgewell/resolve-uri": "https://cdn.jsdelivr.net/npm/@jridgewell/resolve-uri@3.1.2/dist/resolve-uri.mjs",
        "@jridgewell/sourcemap-codec": "https://cdn.jsdelivr.net/npm/@jridgewell/sourcemap-codec@1.5.5/dist/sourcemap-codec.mjs",
        "convert-source-map": "https://cdn.jsdelivr.net/npm/convert-source-map@2.0.0/+esm",
        "fast-xml-parser": "https://cdn.jsdelivr.net/npm/fast-xml-parser@5.10.1/+esm",
        "fflate": "https://cdn.jsdelivr.net/npm/fflate@0.8.3/esm/browser.js",
        "@jscadui/3mf-export": "https://cdn.jsdelivr.net/npm/@jscadui/3mf-export@0.5.0/index.js"
      }
    }
  </script>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <!-- Left: banner + status + code editor -->
    <aside class="editor-panel">
      <header class="panel-banner">
        <h1>faijs <span class="subtitle">CAD Scripting Demo</span></h1>
        <div class="banner-controls">
          <select id="example-select" class="select">
            <option value="box-boolean">Box + Sphere Subtract</option>
            <option value="drill-test">Box + Cylinder Drill</option>
            <option value="text-engrave">Text Engrave</option>
            <option value="transform-chain">Transform Chain</option>
          </select>
          <button id="run-btn" class="btn btn-primary">Run ▶</button>
        </div>
      </header>
      <div id="status-bar" class="status-bar info">Ready</div>
      <textarea id="code-editor" class="code-editor" spellcheck="false" placeholder="// faijs source code"></textarea>
    </aside>

    <!-- Right: two stacked 3D viewers (top: brep/STEP, bottom: mesh/STL) -->
    <main class="viewer-panel">
      <div class="view-cell">
        <button id="btn-step" class="view-label-btn" disabled title="Download BREP model as STEP">STEP ⬇</button>
        <canvas id="canvas-brep"></canvas>
      </div>
      <div class="view-cell">
        <button id="btn-stl" class="view-label-btn" disabled title="Download mesh model as STL">STL ⬇</button>
        <canvas id="canvas-mesh"></canvas>
      </div>
    </main>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
