# column-semantics.yaml — 列语义分派表（方案 §5.3.1：列语义的唯一真源）
# 生成自上游 34 张 CSV 的实测表头（2026-09-14），语义依据 fastener.py/bearing.py 实测：
#   参数表全列统一 is_safe→eval（metric 原值 / imperial ×25.4），否则原样字符串；
#   recess/part/Designation/drill 等字符串列不是特例——同一规则自然产出字符串。
# columns 按列序排列（list 而非 map：tapered 轴承表有重复列名 SKT:B/SKT:C，
#   上游 csv.DictReader 语义是后者覆盖前者，gen-data 按同样规则合并）。
# 求值器 id：
#   key                       行键（同时决定该行 is_metric）
#   safe_eval                 统一求值（is_metric 按行键首字符）
#   safe_eval_metric          统一求值（强制公制，不乘 25.4）
#   clearance_hole_ref        原样钻头引用，运行期经 drill_sizes 解析
#   tap_hole_ref              同上（tap 表）
#   drill_diameter_imperial   英制直径 float×25.4（drill_sizes 专用）
#   nominal_unit / nominal_sizes  nominal_screw_lengths 专用

